<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>CIVICPRO — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fb; color: #0f172a; font-family: 'Trebuchet MS', sans-serif; min-height: 100vh; min-height: 100dvh; display: grid; align-content: center; padding: 32px; }
    main { max-width: 420px; width: 100%; margin: auto; }
    img { border-radius: 12px; width: 64px; height: 64px; }
    .brand { font-size: 14px; font-weight: bold; margin: 22px 0 36px; }
    h1 { font-size: 34px; line-height: 1.15; margin: 0 0 16px; }
    p { line-height: 1.7; font-size: 15px; color: #596679; }
    a { background: #b45309; color: #fff; min-height: 48px; padding: 14px 22px; text-decoration: none; display: inline-block; border-radius: 6px; font-weight: bold; margin-top: 12px; }
    small { display: block; margin-top: 28px; color: #596679; line-height: 1.6; }
  </style>
</head>
<body><main data-testid="offline-page">
  <img src="/icons/icon-192.png" alt="CIVICPRO" />
  <div class="brand">CIVICPRO / FIELD COMMAND</div>
  <h1 data-testid="offline-title">A little out of range.</h1>
  <p data-testid="offline-message">Reconnect to the internet to open your workspace. Your saved project data stays on the server.</p>
  <a href="/" data-testid="offline-retry-button">Try again</a>
  <small data-testid="offline-privacy-note">Private project records aren't stored on this device for offline access. New updates can't be saved while offline.</small>
</main></body>
</html>
